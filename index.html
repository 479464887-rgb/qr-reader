<!DOCTYPE html><html lang="zh-CN"><head>
<meta property="og:title" content="Qr Reader — DevKit">
<meta property="og:description" content="Free online Qr Reader tool — fast, simple, and no signup required.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://479464887-rgb.github.io/qr-reader/">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="https://479464887-rgb.github.io/qr-reader/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠</text></svg>">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="QR Code Reader - 上传图片识别二维码"><meta property="og:title" content="QR Code Reader"><title>QR Code Reader</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}header h1{font-size:20px;color:#58a6ff}.lang-switch{display:flex;gap:4px}.lang-switch button{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}.lang-switch button.active{background:#1f6feb;border-color:#1f6feb;color:#fff}.container{max-width:800px;margin:0 auto;padding:24px;text-align:center}.upload-zone{background:#161b22;border:2px dashed #30363d;border-radius:12px;padding:40px 20px;cursor:pointer;transition:border-color .2s;margin-bottom:20px}.upload-zone:hover{border-color:#58a6ff}.upload-zone.dragover{border-color:#3fb950;background:rgba(35,134,54,.05)}.upload-icon{font-size:48px;margin-bottom:12px}.upload-text{font-size:14px;color:#8b949e;margin-bottom:8px}.upload-hint{font-size:12px;color:#484f58}.preview-area{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:16px;display:none}.preview-area img{max-width:300px;max-height:300px;border-radius:4px}.result-area{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;display:none}.result-content{font-family:monospace;font-size:14px;word-break:break-all;padding:12px;background:#0d1117;border-radius:6px;margin:8px 0;color:#7ee787}.result-type{font-size:12px;color:#8b949e;margin-bottom:4px}.error{color:#f85149;font-size:13px;margin-top:8px}.btn{background:#21262d;color:#c9d1d9;border:1px solid #30363d;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;margin:4px}.btn:hover{background:#30363d}.btn-primary{background:#238636;border-color:#238636;color:#fff}</style></head><body><header><h1>📷 QR Code Reader</h1><div class="lang-switch"><button class="active" onclick="setLang("zh")">中文</button><button onclick="setLang("en")">EN</button></div></header><div class="container"><input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(event)"><div class="upload-zone" id="dropZone" onclick="document.getElementById("fileInput").click()"><div class="upload-icon">📤</div><div class="upload-text">点击上传或拖拽图片到这里</div><div class="upload-hint">支持 PNG, JPG, GIF, WebP</div></div><div class="preview-area" id="previewArea"><img id="previewImg" alt="Preview"></div><div class="result-area" id="resultArea"><div class="result-type" id="resultType">识别结果</div><div class="result-content" id="resultContent"></div><button class="btn" onclick="copyResult()">📋 复制结果</button><button class="btn" onclick="openResult()">🔗 打开链接</button></div><div class="error" id="error"></div></div><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script>var lang="zh";function setLang(l){lang=l;document.querySelectorAll(".lang-switch button").forEach(function(b,i){b.classList.toggle("active",(i===0&&l==="zh")||(i===1&&l==="en"))})}var dropZone=document.getElementById("dropZone");dropZone.addEventListener("dragover",function(e){e.preventDefault();dropZone.classList.add("dragover")});dropZone.addEventListener("dragleave",function(){dropZone.classList.remove("dragover")});dropZone.addEventListener("drop",function(e){e.preventDefault();dropZone.classList.remove("dragover");var file=e.dataTransfer.files[0];if(file)processFile(file)});function handleFile(e){var file=e.target.files[0];if(file)processFile(file)}function processFile(file){if(!file.type.match(/image//)){showError("请选择图片文件");return}var reader=new FileReader();reader.onload=function(e){var img=new Image();img.onload=function(){document.getElementById("previewArea").style.display="block";document.getElementById("previewImg").src=e.target.result;var canvas=document.createElement("canvas");var ctx=canvas.getContext("2d");var maxW=1200,scale=1;if(img.width>maxW)scale=maxW/img.width;canvas.width=img.width*scale;canvas.height=img.height*scale;ctx.drawImage(img,0,0,canvas.width,canvas.height);var imageData=ctx.getImageData(0,0,canvas.width,canvas.height);try{var code=jsQR(imageData.data,imageData.width,imageData.height);if(code){document.getElementById("resultArea").style.display="block";document.getElementById("resultContent").textContent=code.data;document.getElementById("resultType").textContent="✅ 识别成功";document.getElementById("error").textContent=""}else{showError("未检测到二维码，请尝试更清晰的图片")}}catch(ex){showError("识别失败: "+ex.message)}};img.src=e.target.result};reader.readAsDataURL(file)}function showError(msg){document.getElementById("error").textContent="❌ "+msg;document.getElementById("resultArea").style.display="none"}function copyResult(){var t=document.getElementById("resultContent").textContent;navigator.clipboard.writeText(t)}function openResult(){var t=document.getElementById("resultContent").textContent;if(t.match(/^https?:\/\//))window.open(t,"_blank");else alert("结果不是有效URL")}</script></body></html>
